name: WhiteHax DAST Verification

on:
  deployment_status:
  workflow_dispatch:
    inputs:
      target_url:
        description: "Deployed application URL to record in SARIF (and create endpoint when WHITEHAX_CREATE_RESOURCES=true)"
        required: true
        type: string
      profile_id:
        description: "Optional WhiteHax profile id override (leave empty to use repository variable/secret default)"
        required: false
        type: string
      report_id:
        description: "Optional existing report id (skips starting a new job; useful for SARIF validation)"
        required: false
        type: string
      fail_on_error:
        description: "Fail the workflow when the WhiteHax adapter errors"
        required: false
        type: boolean
        default: false

jobs:
  whitehax_dast_scan:
    name: WhiteHax DAST Scan
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.deployment_status.state == 'success' &&
        github.event.deployment_status.environment_url != ''
      )
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install WhiteHax scan dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f whitehax_scans/requirements.txt ]; then
            pip install -r whitehax_scans/requirements.txt
          else
            pip install requests
          fi

      - name: Resolve scan inputs
        id: scan_inputs
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TARGET_URL='${{ inputs.target_url }}'
          else
            TARGET_URL='${{ github.event.deployment_status.environment_url }}'
          fi

          if [ -z "$TARGET_URL" ]; then
            echo "TARGET_URL is empty" >&2
            exit 1
          fi

          PROFILE_ID='${{ inputs.profile_id }}'
          if [ -z "$PROFILE_ID" ]; then
            PROFILE_ID='${{ secrets.WHITEHAX_PROFILE_ID }}'
          fi

          REPORT_ID='${{ inputs.report_id }}'
          FAIL_ON_ERROR='${{ inputs.fail_on_error }}'
          if [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            FAIL_ON_ERROR='false'
          fi
          if [ -z "$FAIL_ON_ERROR" ]; then
            FAIL_ON_ERROR='false'
          fi

          {
            echo "target_url=$TARGET_URL"
            echo "profile_id=$PROFILE_ID"
            echo "report_id=$REPORT_ID"
            echo "fail_on_error=$FAIL_ON_ERROR"
          } >> "$GITHUB_OUTPUT"

      - name: Execute WhiteHax DAST security automation
        env:
          WHITEHAX_URL: ${{ secrets.WHITEHAX_URL }}
          WHITEHAX_API_KEY: ${{ secrets.WHITEHAX_API_KEY }}
          WHITEHAX_EMAIL: ${{ secrets.WHITEHAX_EMAIL }}
          WHITEHAX_PASSWORD: ${{ secrets.WHITEHAX_PASSWORD }}
          WHITEHAX_PROFILE_ID: ${{ steps.scan_inputs.outputs.profile_id }}
          WHITEHAX_REPORT_ID: ${{ steps.scan_inputs.outputs.report_id }}
          WHITEHAX_CREATE_RESOURCES: ${{ secrets.WHITEHAX_CREATE_RESOURCES }}
          TARGET_URL: ${{ steps.scan_inputs.outputs.target_url }}
          WHITEHAX_FAIL_ON_ERROR: ${{ steps.scan_inputs.outputs.fail_on_error }}
        run: |
          echo "Starting WhiteHax DAST verification"
          echo "Target URL: $TARGET_URL"
          if [ -n "$WHITEHAX_PROFILE_ID" ]; then
            echo "Using profile id: $WHITEHAX_PROFILE_ID"
          else
            echo "No profile id provided; adapter will create endpoint/profile resources"
          fi
          python whitehax_scans/whitehax_tests.py

      - name: Upload WhiteHax findings to GitHub code scanning
        if: always() && hashFiles('whitehax_results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: whitehax_results.sarif
          category: whitehax-dast
